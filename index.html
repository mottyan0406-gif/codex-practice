<!DOCTYPE html>
<html lang="ja">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>社内AI勉強会 | 告知ページ</title>
    <link rel="preconnect" href="https://fonts.googleapis.com" />
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
    <link
      href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;700&family=Noto+Sans+JP:wght@400;500;700&display=swap"
      rel="stylesheet"
    />
    <link rel="stylesheet" href="styles.css" />
  </head>
  <body>
    <main class="page">
      <section class="flyer">
        <div class="hero" role="img" aria-label="AI勉強会をイメージした未来的な背景">
          <div class="hero__overlay">
            <p class="badge">社内コミュニティ</p>
            <div class="hero__text">
              <p class="eyebrow">AI Study Meetup</p>
              <h1>AI勉強会</h1>
              <p class="lead">
                最新の生成AI活用事例や社内プロジェクトの紹介を通じて、
                すぐに役立つ知識を持ち帰れるライトな勉強会です。
              </p>
            </div>
          </div>
        </div>
        <div class="details">
          <div class="detail">
            <div class="detail__label">タイトル</div>
            <div class="detail__value">未来をつくる生成AI実践セミナー</div>
          </div>
          <div class="detail">
            <div class="detail__label">開催日時</div>
            <div class="detail__value">2024年6月28日(金) 18:30 - 20:30</div>
          </div>
          <div class="detail">
            <div class="detail__label">場所</div>
            <div class="detail__value">本社 12F カンファレンスルーム &amp; オンライン配信</div>
          </div>
        </div>
      </section>
    </main>
  </body>
</html>
